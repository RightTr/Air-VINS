%YAML:1.0

# NUS thermal stereo with Realsense D455f IMU.
system:
  imu: 1
  num_of_cam: 2
  multiple_thread: 1
  output_path: "/workspace/src/VINS-Fusion/output/"

topics:
  imu: "/imu0"
  image0: "/cam0/image_raw"
  image1: "/cam1/image_raw"

camera:
  image_width: 640
  image_height: 512
  cam0_intrinsics: [302.165801415368, 302.165801415368, 305.290283203125, 273.441696166992]
  cam1_intrinsics: [302.165801415368, 302.165801415368, 305.290283203125, 273.441696166992]
  # body is the raw D455f IMU/accelerometer frame.
  estimate_extrinsic: 0
  body_T_cam0: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.999651434095, 0.004713792743, -0.025975714936, -0.043945602795,
           -0.004532603359, 0.999965012079, 0.007029808085, 0.069428185645,
           0.026007944584, -0.006909620444, 0.999637877441, 0.038427399748,
           0.0, 0.0, 0.0, 1.0]
  body_T_cam1: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.999651434095, 0.004713792743, -0.025975714936, 0.077675086956,
           -0.004532603359, 0.999965012079, 0.007029808085, 0.068876735081,
           0.026007944584, -0.006909620444, 0.999637877441, 0.041591606842,
           0.0, 0.0, 0.0, 1.0]

feature_tracker:
  max_cnt: 400
  min_dist: 30
  freq: 10
  F_threshold: 1.0
  show_track: 1
  flow_back: 1
  min_depth: 0.1
  max_depth: 8.0

deep_feature:
  enabled: 1
  model_dir: "/root/stirslam_ws/install/vins/share/vins/output"
  matcher: 0  # 0 for LightGlue, 1 for SuperGlue
  max_keypoints: 400
  keypoint_threshold: 0.004
  remove_borders: 4
  stereo_y_threshold: 1.0
  min_stereo_disparity: 4.0

keyframe:
  min_init_stereo_feature: 10
  lost_num_match: 10
  min_num_match: 30
  max_num_match: 80
  tracking_point_rate: 0.7
  tracking_parallax_rate: 0.1

loop_closure:
  descriptor_method: 2
  vprnet_engine_path: "/root/stirslam_ws/install/vins/share/vins/output/ResNet50_512_eigenplaces.engine"
  vprnet_onnx_path: "/root/stirslam_ws/install/vins/share/vins/output/ResNet50_512_eigenplaces.onnx"
  loop_threshold: 0.75
  loop_margin: 0.0
  exclude_recent: 50

nuc:
  enable_handle: 1

estimator:
  max_solver_time: 0.04
  max_num_iterations: 8
  keyframe_parallax: 5.0
  acc_n: 0.1
  gyr_n: 0.01
  acc_w: 0.001
  gyr_w: 0.0001
  g_norm: 9.6514
  estimate_td: 0
  td: 0.0
