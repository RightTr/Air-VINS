%YAML:1.0

# Scout stereo thermal + IMU. The node subscribes to live raw image topics.
# Calibration source: Calibration parameters.docx (Scout calibration document).
# Image size is assumed to be 640x512; verify against the published messages.
# Body uses the RGB camera origin and orientation. The RGB-to-IMU translation is
# not in the calibration document, so these body_T_cam values assume it is zero.
system:
  imu: 1
  num_of_cam: 2
  multiple_thread: 1
  mode: 0  # 0: online, drop old frames; 1: offline, process every queued frame
  output_path: ""  # Defaults to the workspace/package output directory.

topics:
  image0: "/guide_left/image"
  image1: "/guide_right/image"
  imu: "/realsense/imu/data"

camera:
  image_width: 640
  image_height: 512
  # Raw camera intrinsics. Stereo rectification replaces these with the rectified
  # projection intrinsics at startup, before feature tracking begins.
  cam0_intrinsics: [401.855283, 402.415658, 329.563855, 263.783339]
  cam1_intrinsics: [401.116455, 401.789989, 311.082463, 251.753843]
  cam0_distortion: [-0.399347, 0.234754, 0.0, 0.0, -0.078159]  # [k1,k2,p1,p2,k3]
  cam1_distortion: [-0.376356, 0.177351, 0.0, 0.0, -0.040225]
  rectify_alpha: 0.0
  estimate_extrinsic: 0
  # Raw RGB/body <- left thermal camera. The document gives this rotation to
  # four decimal places; it was projected onto SO(3) before writing here.
  body_T_cam0: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.999979419057, -0.006194120760, -0.001671625244, 0.003713250000,
           0.006205670234, 0.999956280786, 0.006994724637, -0.002168280000,
           0.001628225993, -0.007004954234, 0.999974139414, -0.000867580000,
           0.0, 0.0, 0.0, 1.0]
  # RGB/body <- right thermal camera. Interpret the document's negative-X
  # calibrated stereo T as left-to-right (consistent with its +X rough baseline),
  # then invert that transform before composition.
  body_T_cam1: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.999381701766, -0.025490242672, -0.024216957082, 0.127896405041,
           0.025908188432, 0.999517988924, 0.017104269848, -0.000171273216,
           0.023769291725, -0.017721111513, 0.999560394883, 0.001940508179,
           0.0, 0.0, 0.0, 1.0]

# Tracking and map-depth thresholds from 0a8fbef's NUS thermal profile.
feature_tracker:
  max_cnt: 400
  min_dist: 30
  F_threshold: 1.0
  show_track: 1
  flow_back: 1
  min_depth: 0.1
  max_depth: 8.0

# The model directory defaults to ../../output relative to this config file.
# That resolves to the model files in both the source and installed package.
deep_feature:
  enabled: 2  # 0: KLT, 1: SuperPoint + Glue, 2: PLNet + Glue
  matcher: 0  # LightGlue
  max_keypoints: 800
  keypoint_threshold: 0.0015
  remove_borders: 4
  stereo_ransac: 1
  stereo_y_threshold: 1.0
  min_stereo_disparity: 4.0
  max_stereo_disparity: 175.0

keyframe:
  min_init_stereo_feature: 10
  lost_num_match: 10
  min_num_match: 30
  max_num_match: 80
  tracking_point_rate: 0.7
  tracking_parallax_rate: 0.1

estimator:
  max_solver_time: 0.04
  max_num_iterations: 8
  keyframe_parallax: 5.0
  # Conservative values above the stationary RealSense sample noise observed
  # on 2026-10-17 (about 0.01 m/s^2 and 0.003 rad/s per axis).
  acc_n: 0.03
  gyr_n: 0.005
  acc_w: 0.001
  gyr_w: 0.0001
  g_norm: 9.81
  # Host callback timestamps can have a fixed camera/IMU delivery offset.
  estimate_td: 1
  td: 0.0
